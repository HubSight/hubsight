<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebRTC decode test</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0f14; color: #d7dde3;
         font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
           padding: 10px 14px; border-bottom: 1px solid #1c2530; }
  select, input, button { background: #131a22; color: #d7dde3; border: 1px solid #2a3644;
                          border-radius: 6px; padding: 6px 10px; font: inherit; }
  button { cursor: pointer; } button:disabled { opacity: .45; cursor: default; }
  button.go { background: #1f6feb; border-color: #1f6feb; color: #fff; font-weight: 600; }
  button.stop { background: #7d2020; border-color: #a33; color: #fff; }
  .wrap { display: grid; grid-template-columns: 1fr 360px; height: calc(100vh - 53px); }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; height: auto; } }
  .stage { position: relative; background: #000; display: flex; align-items: center; justify-content: center; min-height: 260px; }
  video { width: 100%; height: 100%; max-height: calc(100vh - 53px); object-fit: contain; background: #000; }
  #verdict { position: absolute; top: 12px; left: 12px; padding: 6px 14px; border-radius: 999px;
             font-weight: 700; letter-spacing: .04em; font-size: 12px; }
  .v-idle { background: #1c2530; color: #7d8b99; }
  .v-wait { background: #3d2c00; color: #ffd479; }
  .v-pass { background: #06331d; color: #4ade80; }
  .v-fail { background: #3d0a0a; color: #ff6b6b; }
  aside { border-left: 1px solid #1c2530; padding: 12px 14px; overflow-y: auto; }
  @media (max-width: 820px) { aside { border-left: none; border-top: 1px solid #1c2530; } }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 2px 0; vertical-align: top; }
  td.k { color: #7d8b99; padding-right: 12px; white-space: nowrap; }
  td.v { text-align: right; font-weight: 600; word-break: break-all; }
  .good { color: #4ade80; } .warn { color: #ffd479; } .bad { color: #ff6b6b; }
  h3 { margin: 16px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #7d8b99; }
  #log, #sdp { white-space: pre-wrap; color: #8a97a5; font-size: 11px; max-height: 170px; overflow: auto;
               background: #0e141b; border: 1px solid #1c2530; border-radius: 6px; padding: 8px; }
  #summary { padding: 10px 14px; }
  #summary table td { padding: 4px 10px 4px 0; }
  #summary .name { color: #d7dde3; font-weight: 600; }
  details > summary { cursor: pointer; color: #7d8b99; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin: 16px 0 6px; }
</style>
</head>
<body>
<header>
  <strong>WebRTC decode test</strong>
  <select id="streams" title="pick a registered stream"><option value="">— streams —</option></select>
  <input id="src" placeholder="stream name, or paste rtsp:// / ffmpeg: source" size="34">
  <button id="reload" title="refresh stream list">↻</button>
  <button id="connect" class="go">Connect</button>
  <button id="testall" title="connect to every stream in turn and report">Test all</button>
  <span id="state" style="color:#7d8b99;margin-left:4px"></span>
</header>
<div class="wrap">
  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <div id="verdict" class="v-idle">idle</div>
  </div>
  <aside>
    <div id="summary" hidden></div>
    <table><tbody id="stats"></tbody></table>
    <details><summary>SDP answer</summary><div id="sdp"></div></details>
    <details open><summary>log</summary><div id="log"></div></details>
  </aside>
</div>
<script>
const $ = s => document.querySelector(s);
const P = new URLSearchParams(location.search);
const base = location.pathname.replace(/\/[^/]*$/, ''); // '' at root, '/webrtc' behind gateway
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const JB_MS = clamp(parseInt(P.get('jb') || '800', 10) || 0, 0, 4000);

const log = m => { const el = $('#log'); el.textContent += m + '\n'; el.scrollTop = el.scrollHeight; };
let pc = null, statsTimer = null, t0 = 0, ttff = 0;
let tempStream = null; // name of a stream we registered on the fly (deleted on disconnect)
const video = $('#video');
let st = null; // per-connection running state
window.__result = { state: 'idle' };

const isSource = v => /^(rtsp|rtsps|rtmp|http|https|ffmpeg|exec|webrtc|homekit|hls|mjpeg):/i.test(v.trim());

// Register `source` as a throwaway go2rtc stream and return its name.
async function registerTemp(source) {
  const name = 'wtest_' + Math.random().toString(36).slice(2, 8);
  let src = source.trim();
  if (/^rtsps?:/i.test(src) && !src.includes('#')) src += '#backchannel=0#transport=tcp';
  const r = await fetch(base + '/api/streams?name=' + encodeURIComponent(name)
    + '&src=' + encodeURIComponent(src), { method: 'PUT' });
  // go2rtc replies 400 with a yaml-persist warning but still registers the stream
  log('register ' + name + ' ← ' + src + '  (http ' + r.status + ') — warming…');
  tempStream = name;
  await new Promise(res => setTimeout(res, 2000)); // let go2rtc open the producer
  return name;
}
async function dropTemp() {
  if (!tempStream) return;
  const n = tempStream; tempStream = null;
  try { await fetch(base + '/api/streams?src=' + encodeURIComponent(n), { method: 'DELETE' }); } catch (_) {}
  log('dropped ' + n);
}
window.addEventListener('pagehide', () => {
  if (tempStream) fetch(base + '/api/streams?src=' + encodeURIComponent(tempStream),
    { method: 'DELETE', keepalive: true }).catch(() => {});
});

function freshState() {
  return { decoded: 0, dropped: 0, lost: 0, tPrev: 0, ticks: 0, decFps: 0, peakFps: 0, firstFrame: false };
}

async function listStreams() {
  try {
    const d = await (await fetch(base + '/api/streams')).json();
    const names = Object.keys(d).sort();
    const sel = $('#streams');
    sel.innerHTML = '<option value="">— streams —</option>' +
      names.map(n => `<option value="${n}">${n}</option>`).join('');
    const remembered = localStorage.getItem('lastStream');
    if (remembered && names.includes(remembered)) sel.value = remembered;
    log('streams: ' + (names.join(', ') || '(none)'));
    return names;
  } catch (e) { log('list failed: ' + e); return []; }
}

function setVerdict(cls, text) {
  const el = $('#verdict'); el.className = 'v-' + cls; el.textContent = text;
  window.__result.state = cls; window.__result.verdict = text;
  document.title = cls === 'pass' ? 'PASS · ' + text : cls === 'fail' ? 'FAIL' : cls.toUpperCase();
}

const row = (k, v, cls) => `<tr><td class="k">${k}</td><td class="v ${cls || ''}">${v}</td></tr>`;

function h264Profile(fmtp) {
  const m = (fmtp || '').match(/profile-level-id=([0-9a-fA-F]{6})/);
  if (!m) return '';
  const p = m[1].slice(0, 2).toLowerCase();
  return p === '64' ? 'High' : p === '4d' ? 'Main' : p === '42' ? 'Baseline' : m[1];
}

async function poll() {
  if (!pc) return;
  const now = performance.now();
  const report = await pc.getStats();
  let inb = null, codec = null, pair = null, transport = null;
  const pairs = [];
  report.forEach(s => {
    if (s.type === 'inbound-rtp' && s.kind === 'video') inb = s;
    if (s.type === 'transport') transport = s;
    if (s.type === 'candidate-pair') pairs.push(s);
  });
  if (inb && inb.codecId) codec = report.get(inb.codecId);
  if (transport && transport.selectedCandidatePairId) pair = report.get(transport.selectedCandidatePairId);
  pair = pair || pairs.find(p => p.nominated) || pairs.find(p => p.state === 'succeeded')
    || pairs.sort((a, b) => (b.bytesReceived || 0) - (a.bytesReceived || 0))[0];
  const local = pair && report.get(pair.localCandidateId);
  const remote = pair && report.get(pair.remoteCandidateId);
  const proto = (pair && pair.protocol) || (local && local.protocol) || (remote && remote.protocol);

  const w = video.videoWidth, h = video.videoHeight;
  if (w > 0 && !st.firstFrame) { st.firstFrame = true; ttff = Math.round(now - t0); }

  const rows = [];
  rows.push(row('resolution', w ? `${w}×${h}` : '0×0', w ? 'good' : 'bad'));
  rows.push(row('time to 1st frame', ttff ? ttff + ' ms' : '—', ttff && ttff < 3000 ? 'good' : ttff ? 'warn' : ''));

  let codecTxt = '?';
  if (codec) {
    const prof = h264Profile(codec.sdpFmtpLine);
    codecTxt = (codec.mimeType || '').split('/')[1] + (prof ? ' ' + prof : '');
  }
  rows.push(row('codec', codecTxt));
  rows.push(row('transport', proto ? proto.toUpperCase()
    + (local && local.candidateType ? ' ' + local.candidateType : '') : '?'));
  if (local && remote) rows.push(row('path', `${local.address || local.ip}:${local.port} → ${remote.address || remote.ip}:${remote.port}`));

  if (inb) {
    const dt = st.tPrev ? (now - st.tPrev) / 1000 : 0;
    st.decFps = dt > 0 ? Math.round((inb.framesDecoded - st.decoded) / dt) : 0;
    if (st.decFps > st.peakFps) st.peakFps = st.decFps;
    const dDrop = Math.max(0, (inb.framesDropped || 0) - st.dropped);
    const dLost = Math.max(0, (inb.packetsLost || 0) - st.lost);
    st.decoded = inb.framesDecoded; st.dropped = inb.framesDropped || 0; st.lost = inb.packetsLost || 0; st.tPrev = now;

    const jbMs = inb.jitterBufferEmittedCount
      ? Math.round(inb.jitterBufferDelay / inb.jitterBufferEmittedCount * 1000) : null;
    const rttMs = pair && pair.currentRoundTripTime != null ? Math.round(pair.currentRoundTripTime * 1000) : null;

    rows.push(row('frames decoded', inb.framesDecoded, inb.framesDecoded > 0 ? 'good' : 'bad'));
    rows.push(row('decode fps', st.decFps, st.decFps >= 10 ? 'good' : st.decFps > 0 ? 'warn' : 'bad'));
    rows.push(row('render fps', inb.framesPerSecond ?? '—'));
    rows.push(row('frames dropped Δ', dDrop, dDrop ? 'warn' : 'good'));
    rows.push(row('packets lost Δ', dLost, dLost ? 'warn' : 'good'));
    rows.push(row('freezes', `${inb.freezeCount ?? 0} · ${(inb.totalFreezesDuration || 0).toFixed(1)}s`,
      inb.totalFreezesDuration > 1 ? 'bad' : inb.totalFreezesDuration ? 'warn' : 'good'));
    rows.push(row('nack / pli', `${inb.nackCount ?? 0} / ${inb.pliCount ?? 0}`,
      (inb.pliCount ?? 0) > 5 ? 'warn' : ''));
    rows.push(row('jitter', Math.round((inb.jitter || 0) * 1000) + ' ms'));
    if (jbMs != null) rows.push(row('jitter buffer', jbMs + ' ms'));
    if (rttMs != null) rows.push(row('rtt', rttMs + ' ms'));
    if (jbMs != null && rttMs != null) rows.push(row('~glass-to-glass', (jbMs + rttMs) + ' ms +enc'));
    rows.push(row('bitrate', dt > 0 ? Math.round((inb.bytesReceived - (st.bytes || 0)) * 8 / dt / 1000) + ' kbps' : '—'));
    st.bytes = inb.bytesReceived;
    rows.push(row('bytes recv', ((inb.bytesReceived || 0) / 1e6).toFixed(2) + ' MB'));
  }
  $('#stats').innerHTML = rows.join('');

  st.ticks++;
  const FAIL_AFTER = parseInt(P.get('t') || '20', 10); // seconds of no-video before FAIL
  if (window.__result.state === 'wait') {
    if (w > 0 && st.decoded > 10) setVerdict('pass', `${w}×${h} · ${st.decFps}fps · ${ttff}ms`);
    else if (st.ticks > FAIL_AFTER) setVerdict('fail', w === 0 ? 'no video decoded (0×0)' : 'frames stalled after ' + st.decoded);
  } else if (window.__result.state === 'pass' && st.decFps > 0) {
    setVerdict('pass', `${w}×${h} · ${st.decFps}fps · ${ttff}ms`); // keep fps live
  }
  Object.assign(window.__result, {
    width: w, height: h, framesDecoded: st.decoded, decodeFps: st.decFps, peakFps: st.peakFps,
    codec: codecTxt, ttffMs: ttff, transport: proto || null,
  });
}

async function connect(src) {
  await disconnect();
  src = (src || $('#src').value || $('#streams').value || '').trim();
  if (!src) { log('no stream selected'); return false; }
  localStorage.setItem('lastStream', src);
  $('#src').value = ''; $('#streams').value = src in {} ? '' : src;

  if (isSource(src)) {
    setVerdict('wait', 'registering…');
    try { src = await registerTemp(src); }
    catch (e) { setVerdict('fail', 'register failed: ' + e.message); return false; }
  }
  $('#connect').disabled = true;
  $('#state').textContent = 'connecting ' + src + ' …';
  setVerdict('wait', 'connecting…');
  st = freshState(); t0 = performance.now(); ttff = 0;
  $('#stats').innerHTML = ''; $('#sdp').textContent = '';
  log('── connect ' + src);

  pc = new RTCPeerConnection({ bundlePolicy: 'max-bundle',
    iceServers: [{ urls: ['stun:stun.l.google.com:19302'] }] });
  window.__pc = pc;
  pc.addTransceiver('video', { direction: 'recvonly' });
  pc.addTransceiver('audio', { direction: 'recvonly' });

  const ms = new MediaStream();
  video.srcObject = ms;
  pc.ontrack = e => {
    if (e.track.kind === 'video') ms.addTrack(e.track);
    if (e.track.kind === 'audio' && !e.track.muted) ms.addTrack(e.track);
    if (JB_MS) { try { e.receiver.jitterBufferTarget = JB_MS; } catch (_) {} }
    video.play().catch(() => {});
  };
  pc.oniceconnectionstatechange = () => log('ice: ' + pc.iceConnectionState);
  pc.onconnectionstatechange = () => {
    $('#state').textContent = src + ' · ' + pc.connectionState;
    log('pc: ' + pc.connectionState);
    if (pc.connectionState === 'failed') setVerdict('fail', 'connection failed');
  };

  try {
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise(r => {
      if (pc.iceGatheringState === 'complete') return r();
      const done = () => { pc.removeEventListener('icegatheringstatechange', done); r(); };
      pc.addEventListener('icegatheringstatechange', () => pc.iceGatheringState === 'complete' && done());
      setTimeout(done, 600);
    });
    const resp = await fetch(base + '/api/webrtc?src=' + encodeURIComponent(src), {
      method: 'POST', headers: { 'Content-Type': 'application/sdp' }, body: pc.localDescription.sdp,
    });
    const answer = await resp.text();
    if (!resp.ok) { setVerdict('fail', 'signaling ' + resp.status); log('signaling ' + resp.status + ': ' + answer); return false; }
    $('#sdp').textContent = answer.split(/\r?\n/).filter(l => /^(m=|a=(rtpmap|fmtp|candidate|setup|mid|sendonly|recvonly|inactive))/.test(l)).join('\n');
    await pc.setRemoteDescription({ type: 'answer', sdp: answer });
    log('answer set');
    statsTimer = setInterval(poll, 1000);
    return true;
  } catch (e) {
    setVerdict('fail', 'error: ' + e.message); log('error: ' + e.stack || e);
    return false;
  } finally {
    $('#connect').disabled = false;
  }
}

async function disconnect() {
  if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
  if (pc) { try { pc.close(); } catch (_) {} pc = null; }
  await dropTemp();
}

async function testAll() {
  await disconnect();
  $('#testall').disabled = $('#connect').disabled = true;
  const names = [...$('#streams').options].map(o => o.value).filter(Boolean);
  const out = [];
  const box = $('#summary'); box.hidden = false;
  box.innerHTML = '<h3>test all — running…</h3>';
  for (const n of names) {
    await connect(n);
    await new Promise(r => setTimeout(r, 9000));
    out.push({ name: n, ...window.__result });
    box.innerHTML = '<h3>test all</h3><table>' + out.map(r =>
      `<tr><td class="name">${r.name}</td>` +
      `<td class="${r.state === 'pass' ? 'good' : 'bad'}">${r.state === 'pass' ? 'PASS' : 'FAIL'}</td>` +
      `<td>${r.width ? r.width + '×' + r.height : '—'}</td>` +
      `<td>${r.peakFps || r.decodeFps || 0}fps</td>` +
      `<td>${r.ttffMs || '—'}ms</td>` +
      `<td>${(r.transport || '').toUpperCase()}</td></tr>`).join('') + '</table>';
  }
  await disconnect();
  $('#testall').disabled = $('#connect').disabled = false;
  setVerdict('idle', `test all done — ${out.filter(r => r.state === 'pass').length}/${out.length} pass`);
}

$('#connect').onclick = () => connect();
$('#reload').onclick = listStreams;
$('#testall').onclick = testAll;
$('#streams').onchange = e => { if (e.target.value) connect(e.target.value); };
$('#src').onkeydown = e => { if (e.key === 'Enter') connect(); };

listStreams().then(names => {
  const s = P.get('src');
  if (s) { $('#src').value = s; if (P.has('auto')) connect(s); }
  else if (P.has('all')) testAll();
});
</script>
</body>
</html>
