log:
  level: info

api:
  listen: ":1984"
  origin: "*"
  static_dir: "/config/www"

rtsp:
  listen: ":8554"
  # TCP: UDP RTP does not route back through Docker/OrbStack NAT (black video).
  default_query: "transport=tcp"

webrtc:
  listen: ":8555"
  candidates:
    - stun:8555
    - rtc.quoctran.space:8555
    - 138.2.87.35:8555
  # No 127.0.0.1 candidate: on a laptop it points the browser at the container's
  # NAT'd port, which mangles WebRTC UDP media (black video). Local dev runs
  # webrtc-service with network_mode: host (docker-compose.override.yml) so go2rtc
  # auto-advertises a directly reachable host address.

# Leave this as a BARE key. go2rtc's config patcher cannot parse flow-style
# `streams: {}` and rejects every `PUT /api/streams` with HTTP 400, so no camera
# ever gets registered. pool-service / core-service populate this at runtime.
streams:
  cam_XbXVEFntLOe5bNHVUtm3R_live_2:
    - rtsp://138.2.87.35:8554/bunny#backchannel=0#transport=tcp
  bunny:
    - rtsp://138.2.87.35:8554/bunny#backchannel=0#transport=tcp
  dead:
    - rtsp://10.99.99.99:554/nope#transport=tcp
  cam_XbXVEFntLOe5bNHVUtm3R_nvr:
    - rtsp://138.2.87.35:8554/bunny#backchannel=0#transport=tcp
    - ffmpeg:cam_XbXVEFntLOe5bNHVUtm3R_nvr#audio=opus
  cam_XbXVEFntLOe5bNHVUtm3R_live_3:
    - rtsp://138.2.87.35:8554/bunny#backchannel=0#transport=tcp
  cam_XbXVEFntLOe5bNHVUtm3R_live_4:
    - rtsp://138.2.87.35:8554/bunny#backchannel=0#transport=tcp
  cam_XbXVEFntLOe5bNHVUtm3R_live_5:
    - rtsp://138.2.87.35:8554/bunny#backchannel=0#transport=tcp
