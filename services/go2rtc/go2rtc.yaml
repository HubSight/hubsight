log:
  level: info

api:
  listen: ":1984"
  origin: "*"
  static_dir: "/config/www"

rtsp:
  listen: ":8554"
  # TCP: UDP RTP does not route back through Docker/OrbStack NAT (black video).
  default_query: "transport=tcp"

webrtc:
  listen: ":8555"
  candidates:
    - 10.20.0.101:8555
    - 127.0.0.1:8555
    - stun:8555
    - rtc.quoctran.space:8555
    - 138.2.87.35:8555

# Leave this as a BARE key. go2rtc's config patcher cannot parse flow-style
# `streams: {}` and rejects every `PUT /api/streams` with HTTP 400, so no camera
# ever gets registered. pool-service / core-service populate this at runtime.
streams:
  cam_XbXVEFntLOe5bNHVUtm3R_live_2:
    - rtsp://138.2.87.35:8554/bunny#backchannel=0#transport=tcp
  bunny:
    - rtsp://138.2.87.35:8554/bunny#backchannel=0#transport=tcp
  dead:
    - rtsp://10.99.99.99:554/nope#transport=tcp
  cam_XbXVEFntLOe5bNHVUtm3R_nvr:
