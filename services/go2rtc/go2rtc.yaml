log:
  level: info

api:
  listen: ":1984"
  origin: "*"

rtsp:
  listen: ":8554"
  default_query: "transport=tcp"

webrtc:
  listen: ":8555"
  candidates:
    - 127.0.0.1:8555
    - stun:8555
    - rtc.quoctran.space:8555
    - 138.2.87.35:8555

# Leave this as a bare key. go2rtc's config patcher cannot parse flow-style
# `streams: {}` and rejects every `PUT /api/streams` with HTTP 400, so no camera
# ever gets registered. pool-service / core-service populate this at runtime.
streams:
  cam_HnT19ndxWGhXb5Y5oEeZQ_nvr:
    - rtsp://host.docker.internal:8556/facetime#backchannel=0#transport=tcp
  cam_HnT19ndxWGhXb5Y5oEeZQ_live_2:
    - rtsp://host.docker.internal:8556/facetime#backchannel=0#transport=tcp
  cam_HnT19ndxWGhXb5Y5oEeZQ_cv:
    - rtsp://host.docker.internal:8556/facetime#backchannel=0#transport=tcp
    - ffmpeg:rtsp://host.docker.internal:8556/facetime#video=h264#framerate=10#audio=none
  cam_HnT19ndxWGhXb5Y5oEeZQ_live_3:
    - rtsp://host.docker.internal:8556/facetime#backchannel=0#transport=tcp
