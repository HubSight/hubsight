syntax = "proto3";

package pb;
option go_package = "cctv/shared/pkg/pb";

message SignalWebRTCRequest {
  string camera_id = 1;
  string sdp_offer = 2;
  string content_type = 3;
}

message SignalWebRTCResponse {
  string sdp_answer = 1;
  string pool_stream_name = 2;
  string pool_conn_index = 3;
}

message ReleaseStreamRequest {
  string camera_id = 1;
  string stream_name = 2;
}

message ReleaseStreamResponse {
  bool success = 1;
}

message HeartbeatStreamRequest {
  string camera_id = 1;
  string stream_name = 2;
}

message HeartbeatStreamResponse {
  bool success = 1;
}

message GetStatusSummaryRequest {}

message PoolSummary {
  int32 total_cameras = 1;
  int32 total_active_streams = 2;
  int32 total_viewers = 3;
}

message GetStatusSummaryResponse {
  PoolSummary summary = 1;
}

service PoolService {
  rpc SignalWebRTC(SignalWebRTCRequest) returns (SignalWebRTCResponse);
  rpc ReleaseStream(ReleaseStreamRequest) returns (ReleaseStreamResponse);
  rpc HeartbeatStream(HeartbeatStreamRequest) returns (HeartbeatStreamResponse);
  rpc GetStatusSummary(GetStatusSummaryRequest) returns (GetStatusSummaryResponse);
}
