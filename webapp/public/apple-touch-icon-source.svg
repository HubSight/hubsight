<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full-bleed source for opaque touch icons (apple-touch-icon, pwa-192/512). No corner
       radius or drop shadow, unlike cctv-logo.svg: iOS composites apple-touch-icon.png with
       no alpha support, filling any transparent/semi-transparent pixel with black, so this
       must fill edge-to-edge and stay fully opaque — iOS applies its own squircle mask. -->
  <defs>
    <linearGradient id="hubOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#hubOrange)" />

  <g transform="translate(116, 116) scale(11.666)" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" />
    <circle cx="12" cy="13" r="3" />
  </g>
</svg>
