<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft Gradient on Orange Squircle -->
    <linearGradient id="hubOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="hubShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#ea580c" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Orange Squircle with Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="128" fill="url(#hubOrange)" filter="url(#hubShadow)" />

  <!-- Lucide Camera Icon in crisp white -->
  <g transform="translate(116, 116) scale(11.666)" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" />
    <circle cx="12" cy="13" r="3" />
  </g>
</svg>
