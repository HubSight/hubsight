<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HubSight" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <title>HubSight</title>
    <style>
      /* ─────────────────────────────────────────────────────────────
         Modern Minimalist White/Light Splash Screen (Mobile & Desktop)
         ───────────────────────────────────────────────────────────── */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      #pwa-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #0f172a;
        z-index: 99999;
        user-select: none;
        -webkit-user-select: none;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }

      .splash-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 24px;
      }

      /* Clean Orange Logo Squircle */
      .splash-logo-box {
        width: 80px;
        height: 80px;
        border-radius: 22px;
        background: #ea580c;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px -5px rgba(234, 88, 12, 0.25), 0 4px 10px -4px rgba(234, 88, 12, 0.15);
        margin-bottom: 20px;
      }

      .splash-logo-icon {
        width: 40px;
        height: 40px;
        color: #ffffff;
      }

      /* Clean App Name */
      .splash-title {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #0f172a;
        margin: 0 0 6px 0;
      }

      /* Clean Slogan */
      .splash-subtitle {
        font-size: 13px;
        font-weight: 500;
        color: #64748b;
        letter-spacing: 0.01em;
        margin: 0 0 24px 0;
      }

      /* Minimalist Loading Bar */
      .splash-loader-bar {
        width: 140px;
        height: 3.5px;
        background: #e2e8f0;
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }

      .splash-loader-indicator {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 45%;
        background: #ea580c;
        border-radius: 999px;
        animation: splashProgress 1.3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      /* Desktop Sizing */
      @media (min-width: 768px) {
        .splash-logo-box {
          width: 88px;
          height: 88px;
          border-radius: 24px;
          margin-bottom: 22px;
        }

        .splash-logo-icon {
          width: 44px;
          height: 44px;
        }

        .splash-title {
          font-size: 28px;
          margin-bottom: 6px;
        }

        .splash-subtitle {
          font-size: 14px;
          margin-bottom: 28px;
        }

        .splash-loader-bar {
          width: 160px;
          height: 4px;
        }
      }

      @keyframes splashProgress {
        0% {
          left: -45%;
        }
        100% {
          left: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Minimalist Clean White/Light Splash Screen (Replaced automatically as soon as React mounts) -->
      <div id="pwa-splash">
        <div class="splash-content">
          <div class="splash-logo-box">
            <svg class="splash-logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path>
              <circle cx="12" cy="13" r="3"></circle>
            </svg>
          </div>
          <h1 class="splash-title">HubSight</h1>
          <p class="splash-subtitle">Smart CCTV & NVR Management</p>
          <div class="splash-loader-bar">
            <div class="splash-loader-indicator"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
