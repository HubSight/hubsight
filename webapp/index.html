<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HubSight" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>HubSight</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('hs_theme') || 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = theme === 'dark' || (theme === 'system' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* ─────────────────────────────────────────────────────────────
          Modern Splash Screen (Light & Dark Theme Adaptive)
      ───────────────────────────────────────────────────────────── */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: #f8fafc;
        font-family: 'Roboto', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      html.dark body,
      html.dark #pwa-splash {
        background-color: #0b0f14 !important;
        color: #f8fafc !important;
      }
      html.dark .splash-title {
        color: #f8fafc !important;
        display: block;
      }
      html.dark .splash-subtitle {
        color: #94a3b8 !important;
      }
      html.dark .splash-loader-bar {
        background: #1c2733 !important;
      }

      #pwa-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #0f172a;
        z-index: 99999;
        user-select: none;
        -webkit-user-select: none;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }

      .splash-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 24px;
      }

      /* App Logo */
      .splash-logo-full {
        width: min(280px, calc(100vw - 48px));
        height: auto;
        margin-bottom: 22px;
        object-fit: contain;
      }

      .splash-logo-mark {
        display: none;
        width: 80px;
        height: 80px;
        border-radius: 20px;
        margin-bottom: 20px;
        object-fit: contain;
      }

      html.dark .splash-logo-full {
        display: none;
      }

      html.dark .splash-logo-mark {
        display: block;
      }

      /* Clean App Name */
      .splash-title {
        display: none;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #0f172a;
        margin: 0 0 6px 0;
      }

      /* Clean Slogan */
      .splash-subtitle {
        font-size: 13px;
        font-weight: 500;
        color: #64748b;
        letter-spacing: 0.01em;
        margin: 0 0 24px 0;
      }

      /* Minimalist Loading Bar */
      .splash-loader-bar {
        width: 140px;
        height: 3.5px;
        background: #e2e8f0;
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }

      .splash-loader-indicator {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 45%;
        background: #ea580c;
        border-radius: 999px;
        animation: splashProgress 1.3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      /* Desktop Sizing */
      @media (min-width: 768px) {
        .splash-logo-full {
          width: 320px;
          margin-bottom: 26px;
        }

        .splash-logo-mark {
          width: 88px;
          height: 88px;
          border-radius: 22px;
          margin-bottom: 22px;
        }

        .splash-title {
          font-size: 28px;
          margin-bottom: 6px;
        }

        .splash-subtitle {
          font-size: 14px;
          margin-bottom: 28px;
        }

        .splash-loader-bar {
          width: 160px;
          height: 4px;
        }
      }

      @keyframes splashProgress {
        0% {
          left: -45%;
        }
        100% {
          left: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Minimalist Clean White/Light Splash Screen (Replaced automatically as soon as React mounts) -->
      <div id="pwa-splash">
        <div class="splash-content">
          <img src="/logo-header.png" alt="HubSight" class="splash-logo-full" width="760" height="160" />
          <img src="/pwa-192x192.png" alt="HubSight" class="splash-logo-mark" width="192" height="192" />
          <h1 class="splash-title">HubSight</h1>
          <p class="splash-subtitle">Smart CCTV & NVR Management</p>
          <div class="splash-loader-bar">
            <div class="splash-loader-indicator"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
