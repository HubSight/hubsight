<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HubSight" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>HubSight</title>
    <style>
      /* Instant Native Splash Screen Styles (0ms cold start) */
      body {
        margin: 0;
        padding: 0;
        background-color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      #pwa-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 40%, #1e293b 0%, #0f172a 100%);
        color: #f8fafc;
        z-index: 99999;
        user-select: none;
        -webkit-user-select: none;
      }

      .splash-ambient-glow {
        position: absolute;
        top: 35%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 320px;
        height: 320px;
        background: rgba(234, 88, 12, 0.15);
        border-radius: 50%;
        filter: blur(80px);
        pointer-events: none;
      }

      .splash-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 20px;
      }

      .splash-logo-box {
        width: 88px;
        height: 88px;
        border-radius: 26px;
        background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 16px 36px rgba(234, 88, 12, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.12) inset;
        margin-bottom: 22px;
        animation: splashPulse 2.4s ease-in-out infinite alternate;
      }

      .splash-logo-icon {
        width: 44px;
        height: 44px;
        color: #ffffff;
      }

      .splash-title {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.025em;
        color: #ffffff;
        margin: 0 0 6px 0;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      }

      .splash-subtitle {
        font-size: 12px;
        font-weight: 500;
        color: #94a3b8;
        letter-spacing: 0.04em;
        margin: 0 0 28px 0;
        text-transform: uppercase;
      }

      .splash-loader-bar {
        width: 140px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }

      .splash-loader-indicator {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 45%;
        background: linear-gradient(90deg, #ea580c, #fb923c);
        border-radius: 999px;
        animation: splashProgress 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      @keyframes splashPulse {
        0% {
          transform: scale(1);
          box-shadow: 0 16px 36px rgba(234, 88, 12, 0.35);
        }
        100% {
          transform: scale(1.04);
          box-shadow: 0 20px 48px rgba(234, 88, 12, 0.55);
        }
      }

      @keyframes splashProgress {
        0% {
          left: -45%;
        }
        100% {
          left: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Native PWA Splash Screen (Replaced automatically as soon as React mounts) -->
      <div id="pwa-splash">
        <div class="splash-ambient-glow"></div>
        <div class="splash-content">
          <div class="splash-logo-box">
            <svg class="splash-logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path>
              <circle cx="12" cy="13" r="3"></circle>
            </svg>
          </div>
          <h1 class="splash-title">HubSight</h1>
          <p class="splash-subtitle">Smart CCTV & NVR</p>
          <div class="splash-loader-bar">
            <div class="splash-loader-indicator"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
