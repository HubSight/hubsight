services:
  # 🚪 Pure API Gateway (Sole Public REST, WebSocket & WebRTC Signaling Entrypoint on :8088)
  api-gateway:
    build:
      context: .
      dockerfile: ./services/gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      PORT: "8080"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      CORE_SERVICE_URL: "http://core-service:8080"
      RELAY_SERVICE_URL: "http://relay-service:3001"
      WEBRTC_SERVICE_URL: "http://webrtc-service:1984"
    depends_on:
      - auth-service
      - core-service
      - relay-service
      - webrtc-service

  # ⚙️ Core CCTV Business Logic Service (Private Internal Microservice)
  core-service:
    build:
      context: .
      dockerfile: ./services/core/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: "${DATABASE_URL}"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      POOL_SERVICE_URL: "http://pool-service:8085"
      POOL_GRPC_URL: "pool-service:50052"
      WEBRTC_SERVICE_URL: "http://webrtc-service:1984"
      RABBITMQ_URL: "amqp://guest:guest@mq-service:5672/"
      M2M_SECRET: "cctv-internal-m2m-secret"
      S3_ENDPOINT: "dl.learncurv.space"
      S3_BUCKET: "cctv"
      S3_ACCESS_KEY: "admin"
      S3_SECRET_KEY: "MinIO123@!"
      S3_USE_SSL: "true"
      # OCI Object Storage — member faces & avatars (NVR archive stays on MinIO above).
      # Fill OCI_ACCESS_KEY / OCI_SECRET_KEY in project .env (Customer Secret Key).
      FACES_S3_ENDPOINT: "${OCI_NAMESPACE:-axyalcmd4cit}.compat.objectstorage.${OCI_REGION:-ap-singapore-1}.oraclecloud.com"
      FACES_S3_BUCKET: "${OCI_FACES_BUCKET:-bucket-faces-cctv}"
      FACES_S3_REGION: "${OCI_REGION:-ap-singapore-1}"
      FACES_S3_NAMESPACE: "${OCI_NAMESPACE:-axyalcmd4cit}"
      FACES_S3_ACCESS_KEY: "${OCI_ACCESS_KEY:-}"
      FACES_S3_SECRET_KEY: "${OCI_SECRET_KEY:-}"
      FACES_S3_USE_SSL: "true"
      FACES_S3_PUBLIC: "true"
      VISION_SERVICE_URL: "http://vision-service:8090"
      HAWKEYES_SERVICE_URL: "http://hawkeyes-service:8091"
      # Public FCM web config + VAPID public key for the SPA (getToken). Sending is push-service.
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      FIREBASE_WEB_API_KEY: "${FIREBASE_WEB_API_KEY:-}"
      FIREBASE_WEB_AUTH_DOMAIN: "${FIREBASE_WEB_AUTH_DOMAIN:-}"
      FIREBASE_WEB_PROJECT_ID: "${FIREBASE_WEB_PROJECT_ID:-}"
      FIREBASE_WEB_STORAGE_BUCKET: "${FIREBASE_WEB_STORAGE_BUCKET:-}"
      FIREBASE_WEB_MESSAGING_SENDER_ID: "${FIREBASE_WEB_MESSAGING_SENDER_ID:-}"
      FIREBASE_WEB_APP_ID: "${FIREBASE_WEB_APP_ID:-}"
    depends_on:
      - auth-service
      - pool-service
      - webrtc-service
      - mq-service
      - hawkeyes-service

  # 🏊 Camera Connection Pool Microservice (Connection #0 for CV, dynamic scale <= 5 clients/conn)
  pool-service:
    build:
      context: .
      dockerfile: ./services/pool/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8085"
      CORE_SERVICE_URL: "http://core-service:8080"
      CORE_GRPC_URL: "core-service:50053"
      WEBRTC_SERVICE_URL: "http://webrtc-service:1984"
      RABBITMQ_URL: "amqp://guest:guest@mq-service:5672/"
      M2M_SECRET: "cctv-internal-m2m-secret"
    depends_on:
      - mq-service
      - webrtc-service

  # 🔐 Internal Auth Microservice (Private, not exposed to host)
  auth-service:
    build:
      context: .
      dockerfile: ./services/auth/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8081"
      DATABASE_URL: "${DATABASE_URL}"
      RABBITMQ_URL: "amqp://guest:guest@mq-service:5672/"
      REDIS_URL: "redis://redis-service:6379"
    depends_on:
      - mq-service
      - redis-service

  # ⚡ Dedicated Socket.IO Relay Microservice (Private, routed via API Gateway :8088/socket.io)
  relay-service:
    build:
      context: .
      dockerfile: ./services/relay/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3001"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      AUTH_GRPC_URL: "auth-service:50051"
      RABBITMQ_URL: "amqp://guest:guest@mq-service:5672/"
      M2M_SECRET: "cctv-internal-m2m-secret"
    depends_on:
      - auth-service
      - mq-service

  # 📼 Internal NVR Recording Engine (Private, not exposed to host)
  nvr-service:
    build:
      context: .
      dockerfile: ./services/recorder/Dockerfile
    restart: unless-stopped
    volumes:
      - cctv_data:/data/camera
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      RABBITMQ_URL: "amqp://guest:guest@mq-service:5672/"
      S3_ENDPOINT: "dl.learncurv.space"
      S3_BUCKET: "cctv"
      S3_ACCESS_KEY: "admin"
      S3_SECRET_KEY: "MinIO123@!"
      S3_USE_SSL: "true"
    depends_on:
      - mq-service

  # 📬 Offline FCM / Web Push worker (Private, consumes push_queue)
  push-service:
    build:
      context: .
      dockerfile: ./services/push/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      RABBITMQ_URL: "amqp://guest:guest@mq-service:5672/"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBSCRIBER: "${VAPID_SUBSCRIBER:-mailto:admin@quoctran.space}"
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:-}"
      FIREBASE_CLIENT_EMAIL: "${FIREBASE_CLIENT_EMAIL:-}"
      FIREBASE_PRIVATE_KEY: "${FIREBASE_PRIVATE_KEY:-}"
      FIREBASE_CREDENTIALS_JSON: "${FIREBASE_CREDENTIALS_JSON:-}"
    depends_on:
      - mq-service

  # 🦅 Hawkeyes — LAN/VPN/Docker RTSP discovery (verified streams only)
  hawkeyes-service:
    build:
      context: .
      dockerfile: ./services/hawkeyes/Dockerfile
    restart: unless-stopped
    cap_add:
      - NET_RAW
      - NET_ADMIN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8091"
      BIND: "0.0.0.0"
      # Comma-separated CIDRs to scan beyond container NICs (LAN / VPN). Example: "192.168.1.0/24,10.8.0.0/24"
      HAWKEYES_EXTRA_CIDRS: ""

  # 👁️ Vision Service (Person Detection via YOLO)
  vision-service:
    build:
      context: .
      dockerfile: ./services/vision/Dockerfile
    restart: unless-stopped
    environment:
      RABBITMQ_URL: "amqp://guest:guest@mq-service:5672/"
      CORE_SERVICE_URL: "http://core-service:8080"
      CORE_GRPC_URL: "core-service:50053"
      M2M_SECRET: "cctv-internal-m2m-secret"
      # Read from go2rtc's internal RTSP server (same buffer as WebRTC stream)
      # so that bounding box timestamps align with the video shown in the browser.
      GO2RTC_RTSP_BASE: "rtsp://webrtc-service:8554"
      PROCESS_FPS: "10"
      ENROLL_HTTP_PORT: "8090"
    depends_on:
      - mq-service
      - webrtc-service
      - core-service

  # 📹 WebRTC Media Server (Media RTP port 8555; Signaling routed via API Gateway :8088/webrtc)
  webrtc-service:
    image: alexxit/go2rtc:latest
    restart: unless-stopped
    ports:
      - "8555:8555/tcp" # WebRTC TCP media
      - "8555:8555/udp" # WebRTC UDP media
      # RTSP port 8554 is NOT exposed to host; only accessible within Docker network
      # Vision-service uses it internally to read the same buffered stream as WebRTC.
    volumes:
      - ./services/go2rtc:/config

  # 🐇 RabbitMQ Message Broker for internal events
  mq-service:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-os_mon system_memory_high_watermark 0.95"

  # 🔵 Valkey Cache & Queue for Asynq background jobs (Drop-in replacement for Redis)
  redis-service:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - cctv_valkey:/data
    command: valkey-server --appendonly yes

  # 🕒 Background Cron & Job Worker Service (Retention, etc.)
  bgrd-service:
    build:
      context: .
      dockerfile: ./services/bgrd/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "redis://redis-service:6379"
      S3_ENDPOINT: "dl.learncurv.space"
      S3_BUCKET: "cctv"
      S3_ACCESS_KEY: "admin"
      S3_SECRET_KEY: "MinIO123@!"
      S3_USE_SSL: "true"
    depends_on:
      - redis-service

volumes:
  cctv_data:
  cctv_valkey:
