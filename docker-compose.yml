services:
  # Internal Auth Microservice (Private, not exposed to host)
  auth-service:
    build:
      context: ./backend
      dockerfile: auth.Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8081"

  # Dedicated Socket.IO Relay Microservice (Exposed on :3005 for Frontend WebSocket)
  relay-service:
    build:
      context: ./relay-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3005:3001"
    environment:
      PORT: "3001"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      M2M_SECRET: "cctv-internal-m2m-secret"
    depends_on:
      - auth-service

  # CCTV API Gateway & Core Server (Sole Public REST API Entrypoint on :8088)
  api-gateway:
    build:
      context: ./backend
      dockerfile: api.Dockerfile
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      AUTH_SERVICE_URL: "http://auth-service:8081"
      RELAY_SERVICE_URL: "http://relay-service:3001"
      WEBRTC_SERVICE_URL: "http://webrtc-service:1984"
      M2M_SECRET: "cctv-internal-m2m-secret"
    depends_on:
      - auth-service
      - relay-service
      - webrtc-service

  # Internal NVR Recording Engine (Private, not exposed to host)
  nvr-service:
    build:
      context: ./backend
      dockerfile: recorder.Dockerfile
    restart: unless-stopped
    volumes:
      - cctv_data:/data/camera
    environment:
      RTSP_URL: rtsp://host.docker.internal:8554/

  # Internal WebRTC Media Server (Only WebRTC media streaming port 8555 is exposed)
  webrtc-service:
    image: alexxit/go2rtc:latest
    restart: unless-stopped
    ports:
      - "8555:8555/tcp" # WebRTC TCP media
      - "8555:8555/udp" # WebRTC UDP media
    volumes:
      - ./go2rtc:/config

volumes:
  cctv_data:
