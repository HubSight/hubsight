services:
  # 🚪 Pure API Gateway (Sole Public REST, WebSocket & WebRTC Signaling Entrypoint on :8088)
  api-gateway:
    build:
      context: .
      dockerfile: ./backend/gateway.Dockerfile
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      PORT: "8080"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      CORE_SERVICE_URL: "http://core-service:8080"
      RELAY_SERVICE_URL: "http://relay-service:3001"
      WEBRTC_SERVICE_URL: "http://webrtc-service:1984"
    depends_on:
      - auth-service
      - core-service
      - relay-service
      - webrtc-service

  # ⚙️ Core CCTV Business Logic Service (Private Internal Microservice)
  core-service:
    build:
      context: ./backend
      dockerfile: core.Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      WEBRTC_SERVICE_URL: "http://webrtc-service:1984"
      RABBITMQ_URL: "amqp://guest:guest@mq-service:5672/"
      M2M_SECRET: "cctv-internal-m2m-secret"
    depends_on:
      - auth-service
      - webrtc-service
      - mq-service

  # 🔐 Internal Auth Microservice (Private, not exposed to host)
  auth-service:
    build:
      context: ./backend
      dockerfile: auth.Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8081"
      RABBITMQ_URL: "amqp://guest:guest@mq-service:5672/"
    depends_on:
      - mq-service

  # ⚡ Dedicated Socket.IO Relay Microservice (Private, routed via API Gateway :8088/socket.io)
  relay-service:
    build:
      context: ./relay-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3001"
      AUTH_SERVICE_URL: "http://auth-service:8081"
      RABBITMQ_URL: "amqp://guest:guest@mq-service:5672/"
      M2M_SECRET: "cctv-internal-m2m-secret"
    depends_on:
      - auth-service
      - mq-service

  # 📼 Internal NVR Recording Engine (Private, not exposed to host)
  nvr-service:
    build:
      context: ./backend
      dockerfile: recorder.Dockerfile
    restart: unless-stopped
    volumes:
      - cctv_data:/data/camera
    environment:
      RTSP_URL: rtsp://host.docker.internal:8554/
      RABBITMQ_URL: "amqp://guest:guest@mq-service:5672/"
    depends_on:
      - mq-service

  # 👁️ Vision Service (Person Detection via YOLO)
  vision-service:
    build:
      context: ./vision-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      RTSP_URL: rtsp://host.docker.internal:8554/cam
      RABBITMQ_URL: "amqp://guest:guest@mq-service:5672/"
      PROCESS_FPS: "0"
    depends_on:
      - mq-service

  # 📹 WebRTC Media Server (Media RTP port 8555; Signaling routed via API Gateway :8088/webrtc)
  webrtc-service:
    image: alexxit/go2rtc:latest
    restart: unless-stopped
    ports:
      - "8555:8555/tcp" # WebRTC TCP media
      - "8555:8555/udp" # WebRTC UDP media
    volumes:
      - ./go2rtc:/config

  # 🐇 RabbitMQ Message Broker for internal events
  mq-service:
    image: rabbitmq:3-management
    restart: unless-stopped

  # 🔴 Redis Cache & Queue for Asynq background jobs
  redis-service:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - cctv_redis:/data
    command: redis-server --appendonly yes

  # 🕒 Background Cron & Job Worker Service (Retention, etc.)
  bgrd-service:
    build:
      context: ./backend
      dockerfile: bgrd.Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: "redis://redis-service:6379"
      POSTGRES_HOST: "cctv-postgres" # Make sure to point to correct DB host if applicable
    depends_on:
      - redis-service

volumes:
  cctv_data:
  cctv_redis:
